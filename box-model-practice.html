<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model practice</title>
    <link rel="stylesheet" href="styles1.css">
</head>
<body>

    <main class="container">
        <h1>CSS Box Model Visualization</h1>
        
        <!-- The Box Model Container -->
        <div class="box margin-box">
            <span class="label">Margin Layer (Space outside)</span>
            <div class="box border-box">
                <span class="label">Border Layer</span>
                <div class="box padding-box">
                    <span class="label">Padding Layer (Click area)</span>
                    <div class="box content-box">
                        <span class="label">Content Area</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
